# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# Releases (docs: ci.md, S13): release-please, CI on the release PR, the fast-forward of the
# release branch (develop+version) and, when enabled, the registry PR.
name: release
on:
  push:
    branches: [develop]
  schedule:
    # Auto-merged commits raise no push.
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    uses: Avunu/frappe-nix/.github/workflows/app-release.yml@01f14f4bd4f57ef4fdb88ee92128b88c9ff92e03 # v2.6.1
    with:
      app: flow
      integration-branch: develop
      runs-on: '["self-hosted","nixos"]'
      release-branch: "version-16"
      pilot-assets: false
    secrets:
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
      APP_ID: ${{ vars.AVUNU_CI_APP_ID || secrets.AVUNU_CI_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
