[project]
name = "flow"
authors = [{ name = "Shrihari Mahabal", email = "shriharimahabal08@gmail.com" }]
description = "Frappe Flow — native AI agents, tools, and triggers for Frappe"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = [
	"beautifulsoup4>=4.13.5,<5",
	"chardet>=5.2,<6",
	"croniter>=6,<7",
	"lancedb>=0.41,<1",
	"litellm>=1.109,<2",
	"onnxruntime>=1.31,<2",
	"openpyxl>=3.1.5,<4",
	"pdfplumber>=0.11.10,<1",
	"pyarrow>=25,<26",
	"pydantic>=2.12.5,<3",
	"python-docx>=1.2,<2",
	"rapidocr>=3.10,<4",
	"requests>=2.33,<3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
pillow = ">=13,<14"
pypdf = ">=6.21.4,<7"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = ["libgl1", "libglib2.0-0"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# E101 also reads the indentation inside multi-line string literals. These two hold a docstring and a
# tool description whose text mixes spaces into the tab-indented block; changing it would change the text.
"flow/tools/builtins.py" = ["E101"]
"flow/flow/doctype/flow_session/flow_session.py" = ["E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16

# The licence is the AGPL the repository already carries (license.txt), not the profile's MIT.
[tool.frappe-nix.org]
license = "AGPL-3.0-or-later"

# A placeholder until the framework ships its own AI support: never listed, so the Marketplace,
# README, icon, screenshot and demo modules are off.
[tool.frappe-nix.listing]
enable = false

[tool.frappe-nix.readme]
enable = false

[tool.frappe-nix.icons]
enable = false

[tool.frappe-nix.screenshots]
enable = false

[tool.frappe-nix.demo]
enable = false

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*"]

# oxfmt reflows HTML, and these are Jinja templates whose rendered whitespace matters, so oxfmt
# leaves them alone.
[tool.frappe-nix.js.oxfmt]
ignore = ["**/*.html"]

# Findings in the existing Vue panel that have no safe autofix. Each is a small rewrite
# (or a deliberate choice) left for a later change, so the rules are off for just that file.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/main.js"]
rules = { "import/no-unassigned-import" = "off", "eslint/no-unused-expressions" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/store.js"]
rules = { "eslint/no-shadow" = "off", "unicorn/no-array-reverse" = "off", "oxc/no-map-spread" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/components/MarkdownText.vue"]
rules = { "unicorn/no-useless-spread" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/api/stream.js"]
rules = { "eslint/no-await-in-loop" = "off" }

# Desk scripts that strict checkJs reports on today. Typing them (JSDoc) is the next PR's work, and
# the list only shrinks from here.

[[tool.frappe-nix.unchecked-js]]
path = "flow/flow/doctype/flow_knowledge_source/flow_knowledge_source.js"
reason = "Not yet typed with JSDoc; checkJs reports errors"

[[tool.frappe-nix.unchecked-js]]
path = "flow/flow/doctype/flow_model/flow_model.js"
reason = "Not yet typed with JSDoc; checkJs reports errors"

[[tool.frappe-nix.unchecked-js]]
path = "flow/flow/doctype/flow_run/flow_run.js"
reason = "Not yet typed with JSDoc; checkJs reports errors"

[[tool.frappe-nix.unchecked-js]]
path = "flow/flow/doctype/flow_session/flow_session.js"
reason = "Not yet typed with JSDoc; checkJs reports errors"

# Whitelisted methods with no test yet. Writing them is the next PR's work, and the list only shrinks.

[[tool.frappe-nix.untested]]
target = "flow.api.api.stop_run"
reason = "Not yet tested; a test is the next PR's work"

[[tool.frappe-nix.untested]]
target = "flow.api.api.get_agent_tools"
reason = "Not yet tested; a test is the next PR's work"

[[tool.frappe-nix.untested]]
target = "flow.flow.doctype.flow_knowledge_source.flow_knowledge_source.FlowKnowledgeSource.reconcile"
reason = "Not yet tested; a test is the next PR's work"

[[tool.frappe-nix.untested]]
target = "flow.flow.doctype.flow_model.flow_model.FlowModel.test_connection"
reason = "Not yet tested; a test is the next PR's work"

[[tool.frappe-nix.untested]]
target = "flow.flow.doctype.flow_model.flow_model.get_provider_models"
reason = "Not yet tested; a test is the next PR's work"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["flow"]

[tool.ty.terminal]
error-on-warning = true
