[project]
name = "flow"
authors = [{ name = "Shrihari Mahabal", email = "shriharimahabal08@gmail.com" }]
description = "Frappe Flow — native AI agents, tools, and triggers for Frappe"
requires-python = ">=3.14"
readme = "README.md"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
dependencies = [
	"beautifulsoup4>=4.13.5,<5",
	"chardet>=5.2,<6",
	"croniter>=6,<7",
	"lancedb>=0.41,<1",
	"litellm>=1.109,<2",
	"onnxruntime>=1.31,<2",
	"openpyxl>=3.1.5,<4",
	"pdfplumber>=0.11.10,<1",
	"pyarrow>=25,<26",
	"pydantic>=2.12.5,<3",
	"python-docx>=1.2,<2",
	"rapidocr>=3.10,<4",
	"requests>=2.33,<3",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
pillow = ">=13,<14"
pypdf = ">=6.21.4,<7"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = ["libgl1", "libglib2.0-0"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# E101 also reads the indentation inside multi-line string literals. These two hold a docstring and a
# tool description whose text mixes spaces into the tab-indented block; changing it would change the text.
"flow/tools/builtins.py" = ["E101"]
"flow/flow/doctype/flow_session/flow_session.py" = ["E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16

# The licence is the AGPL the repository already carries (license.txt), not the profile's MIT.
[tool.frappe-nix.org]
license = "AGPL-3.0-or-later"

# A placeholder until the framework ships its own AI support: never listed, so the Marketplace,
# README, icon, screenshot and demo modules are off.
[tool.frappe-nix.listing]
enable = false

[tool.frappe-nix.readme]
enable = false

[tool.frappe-nix.icons]
enable = false

[tool.frappe-nix.screenshots]
enable = false

[tool.frappe-nix.demo]
enable = false

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*"]

# oxfmt reflows HTML, and these are Jinja templates whose rendered whitespace matters, so oxfmt
# leaves them alone.
[tool.frappe-nix.js.oxfmt]
ignore = ["**/*.html"]

# Findings in the Vue panel that stay on purpose, so the rule is off for just that file: main.js
# imports its stylesheet for the side effect; store.js copies before it reverses and spreads into a
# fresh record per question; MarkdownText.vue copies a live node list before it removes from it;
# stream.js reads the response one chunk at a time.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/main.js"]
rules = { "import/no-unassigned-import" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/store.js"]
rules = { "unicorn/no-array-reverse" = "off", "oxc/no-map-spread" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/components/MarkdownText.vue"]
rules = { "unicorn/no-useless-spread" = "off" }

[[tool.frappe-nix.js.oxlint.overrides]]
files = ["frontend/src/api/stream.js"]
rules = { "eslint/no-await-in-loop" = "off" }

# A declaration file that augments a module has to be a module itself, and the bare import is what
# makes it one.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["types/**"]
rules = { "import/no-unassigned-import" = "off" }

# The panel is a Vue SPA in JavaScript: vue-tsc runs checkJs over the components and scripts.
[[tool.frappe-nix.typescript.spa]]
root = "frontend"
include = ["frontend/src/**"]
tsconfig = "frontend/tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p frontend/tsconfig.json"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["flow"]

[tool.ty.terminal]
error-on-warning = true
